
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>{{ app_name }} — Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">λ</span> ANICORE<span class="brand-tm">™</span>
    </a>
    <nav>
      <a href="/">Back to home</a>
    </nav>
  </header>

  <main class="auth-page-main">
    <section class="auth-card">
      <span class="eyebrow">WELCOME TO ANICORE</span>

      <h1 id="auth-heading">Sign in<span>.</span></h1>

      <p class="auth-intro" id="auth-intro">
        Sign in to continue your anime journey.
      </p>

      <form id="auth-form" class="auth-form">
        <label>
          Email address
          <input
            id="auth-email"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
            placeholder="you@example.com"
          >
        </label>

        <label>
          Password
          <input
            id="auth-password"
            type="password"
            required
            minlength="8"
            maxlength="128"
            autocomplete="current-password"
            placeholder="At least 8 characters"
          >
        </label>

        <button class="btn btn-red full" type="submit" id="auth-submit">
          Sign in
        </button>
      </form>

      <p class="auth-switch-line">
        <span id="auth-switch-label">New to Anicore?</span>
        <button id="auth-switch" class="text-button" type="button">
          Create an account
        </button>
      </p>

      <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>

      <p class="auth-back">
        <a href="/">← Return to Anicore</a>
      </p>
    </section>
  </main>

  <script src="/static/auth.js"></script>
</body>
  </html>
