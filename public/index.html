<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANICORE</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <header class="app-header">
    <a class="brand" href="#" onclick="showPage('home')">ANICORE<span>™</span></a>
    <div>
      <button id="authBtn" class="outline" onclick="openAuth()">Sign In</button>
      <button id="logoutBtn" class="outline hidden" onclick="logout()">Logout</button>
    </div>
  </header>

  <main id="appMain">
    <!-- HOME -->
    <section class="page active" id="page-home">
      <div style="padding: 40px 5%; text-align: center;">
        <h1>Discover Your Next Story</h1>
        <p class="muted">Anime, TV Shows, and Movies.</p>
      </div>
      <h3 style="padding-left: 5%;">Trending Anime</h3>
      <div id="homeAnimeGrid" class="media-grid"></div>
      
      <h3 style="padding-left: 5%;">Popular TV Shows</h3>
      <div id="homeTvGrid" class="media-grid"></div>
    </section>

    <!-- ANIME -->
    <section class="page" id="page-anime">
      <div style="padding: 20px 5%;">
        <h2>Anime Catalogue</h2>
        <input type="search" id="animeSearch" placeholder="Search anime...">
        <div id="animeGrid" class="media-grid"></div>
        <button id="loadMoreAnime" class="outline" style="width:100%; margin-top:20px;">Load More</button>
      </div>
    </section>

    <!-- TV SHOWS -->
    <section class="page" id="page-tv">
      <div style="padding: 20px 5%;">
        <h2>TV Shows</h2>
        <div id="tvGrid" class="media-grid"></div>
      </div>
    </section>

    <!-- MOVIES -->
    <section class="page" id="page-movies">
      <div style="padding: 20px 5%;">
        <h2>Movies</h2>
        <div id="movieGrid" class="media-grid"></div>
      </div>
    </section>

    <!-- PROFILE -->
    <section class="page" id="page-profile">
      <div style="padding: 20px 5%;">
        <h2>My Profile</h2>
        <div id="profileInfo" class="muted">Sign in to see details.</div>
        <h3>My Watchlist</h3>
        <div id="watchlistGrid" class="media-grid"></div>
      </div>
    </section>

    <!-- ADMIN -->
    <section class="page" id="page-admin">
      <div style="padding: 20px 5%;">
        <h2>Admin Studio</h2>
        <div class="panel">
          <h3>Add Anime</h3>
          <form id="adminAnimeForm">
            <input id="aTitle" placeholder="Title" required>
            <input id="aPoster" placeholder="Poster URL">
            <button type="submit" class="primary">Save Anime</button>
          </form>
        </div>
        <div class="panel">
          <h3>Requests</h3>
          <div id="adminRequests"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeAuth()">×</button>
      <h2>Welcome</h2>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPass" placeholder="Password" required>
        <button type="submit" class="primary" style="width:100%">Sign In / Register</button>
      </form>
    </div>
  </div>

  <!-- DETAIL MODAL (With AR & Widget Support) -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeDetail()">×</button>
      <div id="detailContent"></div>
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="outline" onclick="alert('AR Viewer Opening...')">📷 View in AR</button>
        <button class="outline" onclick="alert('Widget Code Copied!')">🔗 Get Widget</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottomNav">
    <button onclick="showPage('home')" class="active"><span class="nav-icon">⌂</span>Home</button>
    <button onclick="showPage('anime')"><span class="nav-icon">▣</span>Anime</button>
    <button onclick="showPage('tv')"><span class="nav-icon">📺</span>TV</button>
    <button onclick="showPage('movies')"><span class="nav-icon">▶</span>Movies</button>
    <button onclick="showPage('profile')"><span class="nav-icon">◉</span>Profile</button>
  </nav>

  <script src="/assets/app.js"></script>
</body>
</html>
